name: CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node 22 checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Verify approved tool catalog
        run: npm --prefix backend run schema:approval

      - name: Install backend dependencies
        run: npm ci --ignore-scripts --prefix backend

      - name: Audit backend dependencies
        run: npm audit --audit-level=low --prefix backend

      - name: Test backend
        run: npm test --prefix backend

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=low --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend
